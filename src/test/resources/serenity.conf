webdriver {
  driver = chrome
  autodownload = true
  wait.for.timeout = 30000
  capabilities {
    browserName = "chrome"
    "goog:chromeOptions" {
      args = ["--window-size=1440,1100", "--lang=es", "--disable-search-engine-choice-screen"]
      prefs {
        "credentials_enable_service" = false
        "profile.password_manager_enabled" = false
      }
    }
  }
}
serenity {
  project.name = "Reto de automatización Toolshop"
  outputDirectory = "target/serenity-reports"
  take.screenshots = FOR_FAILURES
  restart.browser.for.each = scenario
  browser.width = 1440
  browser.height = 1100
}
